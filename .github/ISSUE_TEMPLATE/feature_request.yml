name: Feature request
description: Propose a focused improvement to Litebox.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operator problem should Litebox solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior and user experience, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or different approaches did you consider?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Operational and compatibility impact
      description: Consider storage, migrations, backups, security, and existing deployments.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues, discussions, and the roadmap.
          required: true
        - label: This request fits Litebox's self-hosted mailbox scope.
          required: true
