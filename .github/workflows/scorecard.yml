name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "17 5 * * 2"
  push:
    branches: [develop]

permissions: read-all # zizmor: ignore[excessive-permissions] Scorecard evaluates repository-wide read-only metadata.

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Supply-chain scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # Upload results to code scanning.
      id-token: write # Publish authenticated results for the public badge.
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Analyze supply-chain posture
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          file_mode: git
      - name: Retain Scorecard results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
          if-no-files-found: error
      - name: Upload Scorecard results to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          sarif_file: results.sarif
