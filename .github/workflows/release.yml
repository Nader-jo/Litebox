name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write # Create and publish the image release notes.
      packages: write # Publish the release image to GHCR.
      id-token: write # Request the OIDC identity used for attestations.
      attestations: write # Publish GitHub artifact attestations.
      artifact-metadata: write # Record artifact metadata with attestations.
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag and source
        shell: bash
        run: |
          set -euo pipefail
          tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $tag_pattern ]]; then
            echo "Release tag must be a valid v-prefixed semantic version." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "Release tags must be annotated (and should be signed)." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/develop; then
            echo "Release tag must point to a commit contained in develop." >&2
            exit 1
          fi
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test release commit
        run: go test ./...
      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" != "true" ]]; then
              echo "Refusing to overwrite an already-published release." >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/nader-jo/litebox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and publish multi-platform image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release
      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/nader-jo/litebox
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Resolve and smoke-test published platforms
        id: platforms
        shell: bash
        env:
          IMAGE_REPOSITORY: ghcr.io/nader-jo/litebox
          INDEX_IMAGE: ghcr.io/nader-jo/litebox@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          manifest="$(docker buildx imagetools inspect --raw "$INDEX_IMAGE")"
          echo "$manifest" | jq -e '
            [.manifests[].platform | select(.os == "linux") | (.os + "/" + .architecture)] as $platforms
            | ($platforms | index("linux/amd64") != null)
              and ($platforms | index("linux/arm64") != null)
          '
          platform_digest() {
            echo "$manifest" | jq -er --arg architecture "$1" '
              [.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == $architecture)
                | .digest]
              | if length == 1 then .[0] else error("expected exactly one platform manifest") end
            '
          }
          amd64_digest="$(platform_digest amd64)"
          arm64_digest="$(platform_digest arm64)"
          echo "amd64_digest=${amd64_digest}" >> "$GITHUB_OUTPUT"
          echo "arm64_digest=${arm64_digest}" >> "$GITHUB_OUTPUT"
          bash scripts/smoke-container.sh "${IMAGE_REPOSITORY}@${amd64_digest}" linux/amd64
          bash scripts/smoke-container.sh "${IMAGE_REPOSITORY}@${arm64_digest}" linux/arm64
      - name: Scan published AMD64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/nader-jo/litebox@${{ steps.platforms.outputs.amd64_digest }}
          version: v0.74.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan published ARM64 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/nader-jo/litebox@${{ steps.platforms.outputs.arm64_digest }}
          version: v0.74.0
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Publish verified GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
