name: litebox

services:
  mailbox:
    image: ${LITEBOX_IMAGE:-ghcr.io/nader-jo/litebox:0.4.1}
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      LITEBOX_DOMAIN: ${LITEBOX_DOMAIN:?Set LITEBOX_DOMAIN in .env (for example mail.example.com)}
      APP_LISTEN_ADDR: :8080
      APP_DATA_DIR: /data
      APP_DB_PATH: /data/mailbox.db
      STORAGE_BACKEND: filesystem
      STORAGE_ROOT: /data/objects
      STORAGE_TMP_ROOT: /data/tmp
    volumes:
      - mailbox-data:/data
    ports:
      - "127.0.0.1:${LITEBOX_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/litebox", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 8s

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      mailbox:
        condition: service_healthy
    environment:
      LITEBOX_HOST: ${LITEBOX_DOMAIN:?Set LITEBOX_DOMAIN in .env (for example mail.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  mailbox-data:
  caddy-data:
  caddy-config:
